<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
    <defs>
        <!-- Gradients -->
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00C9FF" />
            <stop offset="100%" stop-color="#92FE9D" />
        </linearGradient>
        <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8E2DE2" />
            <stop offset="100%" stop-color="#4A00E0" />
        </linearGradient>
        
        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Centered Logo Icon Group -->
    <g transform="translate(20, 20)">
        <!-- Outer Solid Light Blue Ring -->
        <circle cx="100" cy="100" r="105" fill="none" stroke="#00C9FF" stroke-width="1.5" opacity="0.3" />
        
        <!-- Inner Dashed Purple Ring -->
        <circle cx="100" cy="100" r="90" fill="none" stroke="url(#aiGrad)" stroke-width="2.5" opacity="0.8" stroke-dasharray="10 8" />

        <!-- Soundwave Bars -->
        <g filter="url(#glow)">
            <rect x="34" y="85" width="12" height="30" rx="6" fill="url(#waveGrad)" />
            <rect x="54" y="65" width="12" height="70" rx="6" fill="url(#waveGrad)" />
            <rect x="74" y="45" width="12" height="110" rx="6" fill="url(#waveGrad)" />
            <rect x="94" y="25" width="12" height="150" rx="6" fill="url(#waveGrad)" />
            <rect x="114" y="55" width="12" height="90" rx="6" fill="url(#waveGrad)" />
            <rect x="134" y="75" width="12" height="50" rx="6" fill="url(#waveGrad)" />
            <rect x="154" y="90" width="12" height="20" rx="6" fill="url(#waveGrad)" />
        </g>

        <!-- Decorative Sparks -->
        <path d="M 160 20 Q 170 20 170 10 Q 170 20 180 20 Q 170 20 170 30 Q 170 20 160 20 Z" fill="#00C9FF" filter="url(#glow)"/>
        <path d="M 20 160 Q 25 160 25 155 Q 25 160 30 160 Q 25 160 25 165 Q 25 160 20 160 Z" fill="#92FE9D" filter="url(#glow)"/>
    </g>
</svg>
